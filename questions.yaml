# Этап 1. Опрос. Пользователь сначала описывает презентацию своими словами и присылает
# исходные данные; модель находит в них ответы на эти вопросы, а бот задаёт по одному
# только те вопросы, на которые ответа нет. Группы только упорядочивают вопросы в ТЗ.
# key — стабильный идентификатор: по нему модель называет вопрос и ответ подставляется
# в промпты. Менять title/text можно свободно, key лучше не трогать после запуска.

groups:
  - key: about
    title: "Группа 1. О презентации"
    questions:
      - key: type
        text: "Что за презентация (продукт, услуга, компания, отчёт и т.д.)?"
      - key: topics
        text: "Какие ключевые темы и сообщения нужно раскрыть?"
      - key: goal
        text: "Цель: что должны сделать зрители после просмотра?"

  - key: audience
    title: "Группа 2. Аудитория и показ"
    questions:
      - key: audience
        text: "Кто аудитория (должность, возраст, отрасль)?"
      - key: usage
        text: "Как будет использоваться презентация (выступление, рассылка, всё вместе)?"
      - key: viewers
        text: "Сколько будет зрителей?"
      - key: volume
        text: "Объем: сколько слайдов или минут (если выступление)?"

  - key: source
    title: "Группа 3. Объём работ"
    questions:
      - key: task
        text: "Что нужно сделать: разработать презентацию с нуля, переработать или оптимизировать существующую презентацию?"
      - key: research
        text: "Нужен ли поиск информации в открытых источниках?"
